<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Singers</title>
    <!--Bootstrap 5-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/main.js" defer></script>
</head>
<body class="bg-primary 50">
    <div class="container mt-5">
        <h1 class="text-center text-light my-5">My Favorite Singers</h1>
        
        <div class="row">
            <!--Column for Image-->
            <div class="col-sm-4">
                <img class="img-fluid" src="images/singer.jpg" alt="Female singer on stage">
            </div>

            <!--Column for Table-->
            <div class="col-sm-8">
                <table class="table table-primary table-striped table-bordered">
                    <thead class="table-dark">
                        <tr>
                            <th>Singer Name</th>
                            <th>Birth Date</th>
                            <th>Favorite Songs</th>
                            <th>Birthplace</th>
                        </tr>
                    </thead>
                    <tbody id="singersTable">

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
</body>
</html>
